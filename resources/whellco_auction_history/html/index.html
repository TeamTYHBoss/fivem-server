<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auction-history" id="auction-history">
        <div class="window">
            <header>
                <h1>Vehicle Auction History</h1>
                <p>View past auctions and bids.</p>
            </header>

            <div class="auctions" id="auctions"></div>

            <div class="bids" id="bids"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
