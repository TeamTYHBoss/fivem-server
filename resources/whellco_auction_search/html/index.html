<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auction-search" id="auction-search">
        <div class="window">
            <header>
                <h1>Vehicle Auction Search</h1>
                <p>Search active auctions.</p>
            </header>

            <div class="search-options">
                <select id="filter-select"></select>
                <input id="search-input" placeholder="Enter search term">
                <button id="search-button">Search</button>
            </div>

            <div class="results" id="results"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
