<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Windows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="windows" id="windows">
        <div class="window">
            <header>
                <h1>Vehicle Windows</h1>
                <p>Choose window tints and colors.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="window-options">
                <select id="tint-select"></select>
                <select id="color-select"></select>
                <button id="apply-button">Apply Windows</button>
            </div>

            <div class="window-list" id="window-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
