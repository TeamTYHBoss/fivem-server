<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="leaderboard" id="leaderboard">
        <div class="window">
            <header>
                <h1>Vehicle Auction Leaderboard</h1>
                <p>View top bidders and sellers.</p>
            </header>

            <div class="leaderboards">
                <div class="bidders" id="bidders"></div>
                <div class="sellers" id="sellers"></div>
            </div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
