<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Paint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="paint" id="paint">
        <div class="window">
            <header>
                <h1>Vehicle Paint</h1>
                <p>Choose colors and finishes.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="paint-options">
                <select id="color-select"></select>
                <select id="finish-select"></select>
                <button id="apply-button">Apply Paint</button>
            </div>

            <div class="paints" id="paints"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
