<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Audio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="audio" id="audio">
        <div class="window">
            <header>
                <h1>Vehicle Audio</h1>
                <p>Choose audio systems and volumes.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="audio-options">
                <select id="system-select"></select>
                <select id="volume-select"></select>
                <button id="apply-button">Apply Audio</button>
            </div>

            <div class="audio-list" id="audio-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
