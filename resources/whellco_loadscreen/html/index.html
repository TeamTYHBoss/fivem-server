<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Loading Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>

    <main>
        <div class="logo">
            <span>W</span>
        </div>

        <h1>WhellCo FiveM</h1>
        <p class="subtitle">Preparing your experience…</p>

        <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <p class="percentage" id="percentage">0%</p>
        <p class="status" id="status">Connecting to server…</p>

        <div class="tip">
            <span class="tip-label">Tip</span>
            <span id="tip-text">Use /hello once you are in the city.</span>
        </div>

        <div class="audio-controls">
            <button id="mute-button" aria-label="Mute music">🔊</button>
            <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.30" aria-label="Music volume">
        </div>
    </main>

    <audio id="background-music" loop preload="auto">
        <source src="music/theme.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
