<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Robbery Minigame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="robbery-minigame" class="hidden">
        <div class="minigame-header">
            <h1>Robbery</h1>
            <span id="timer">8</span>
        </div>

        <div class="progress-track">
            <div id="progress-bar"></div>
        </div>

        <div class="instructions">
            Press the highlighted key when the marker enters the target zone.
        </div>

        <div class="target-zone">
            <div id="moving-marker"></div>
        </div>

        <button id="attempt-button">Press E</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
