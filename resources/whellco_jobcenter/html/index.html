<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Job Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="jobcenter" id="jobcenter">
        <div class="window">
            <header>
                <h1>Job Center</h1>
                <p>Browse, apply and track jobs.</p>
            </header>

            <div class="jobs" id="jobs"></div>

            <div class="applications" id="applications"></div>

            <div class="history" id="history"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
