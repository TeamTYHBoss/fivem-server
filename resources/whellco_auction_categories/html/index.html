<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Categories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auction-categories" id="auction-categories">
        <div class="window">
            <header>
                <h1>Vehicle Auction Categories</h1>
                <p>View and manage auction categories.</p>
            </header>

            <div class="category-options">
                <select id="category-select"></select>
                <button id="set-button">Set Category</button>
            </div>

            <div class="auction-list" id="auction-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
