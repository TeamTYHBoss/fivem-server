<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin" id="admin">
        <div class="window">
            <header>
                <h1>Admin Panel</h1>
                <p>Search characters and manage balances.</p>
            </header>

            <div class="search">
                <input id="search" placeholder="Search by name or identifier">
                <button id="search-button">Search</button>
            </div>

            <div class="results" id="results"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
