<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Insights Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auction-dashboard" id="auction-dashboard">
        <div class="window">
            <header>
                <h1>Vehicle Auction Insights Dashboard</h1>
                <p>Monitor auction performance and insights.</p>
            </header>

            <div class="dashboard-options">
                <select id="filter-select"></select>
                <button id="filter-button">Apply Filter</button>
            </div>

            <div class="insight-list" id="insight-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
