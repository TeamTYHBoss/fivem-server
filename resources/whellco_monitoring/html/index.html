<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="monitoring" id="monitoring">
        <div class="window">
            <header>
                <h1>Monitoring</h1>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
