<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Plates</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="plates" id="plates">
        <div class="window">
            <header>
                <h1>Vehicle Plates</h1>
                <p>Choose plate types and colors.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="plate-options">
                <select id="type-select"></select>
                <select id="color-select"></select>
                <button id="apply-button">Apply Plate</button>
            </div>

            <div class="plate-list" id="plate-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
