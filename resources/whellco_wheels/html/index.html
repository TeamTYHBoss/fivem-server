<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Wheels</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wheels" id="wheels">
        <div class="window">
            <header>
                <h1>Vehicle Wheels</h1>
                <p>Choose wheel types and colors.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="wheel-options">
                <select id="wheel-type-select"></select>
                <select id="wheel-color-select"></select>
                <button id="apply-button">Apply Wheels</button>
            </div>

            <div class="wheel-list" id="wheel-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
