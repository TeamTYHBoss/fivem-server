<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Character Wardrobe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wardrobe" id="wardrobe">
        <aside class="panel">
            <h1>Character Wardrobe</h1>

            <div class="section">
                <h2>Character</h2>
                <div class="model-buttons">
                    <button data-model="male">Male</button>
                    <button data-model="female">Female</button>
                </div>
            </div>

            <div class="section">
                <h2>Appearance</h2>

                <label>
                    Face shape
                    <input type="range" id="face-shape" min="0" max="45" value="0">
                </label>

                <label>
                    Skin tone
                    <input type="range" id="skin-tone" min="0" max="45" value="0">
                </label>

                <label>
                    Hair style
                    <input type="range" id="hair-style" min="0" max="80" value="0">
                </label>

                <label>
                    Hair colour
                    <input type="range" id="hair-colour" min="0" max="63" value="0">
                </label>
            </div>

            <div class="section">
                <h2>Clothing</h2>

                <label>
                    Top
                    <input type="range" id="torso" min="0" max="150" value="0">
                </label>

                <label>
                    Undershirt
                    <input type="range" id="undershirt" min="0" max="150" value="0">
                </label>

                <label>
                    Legs
                    <input type="range" id="legs" min="0" max="150" value="0">
                </label>

                <label>
                    Shoes
                    <input type="range" id="shoes" min="0" max="150" value="0">
                </label>
            </div>

            <button id="confirm-button">Confirm Character</button>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
