<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Tags</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auction-tags" id="auction-tags">
        <div class="window">
            <header>
                <h1>Vehicle Auction Tags</h1>
                <p>Manage auction tags.</p>
            </header>

            <div class="tag-options">
                <input id="auction-input" placeholder="Enter auction ID">
                <input id="tag-input" maxlength="24" placeholder="Enter tag">
                <button id="add-button">Add Tag</button>
            </div>

            <div class="tag-list" id="tag-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
