<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IPTV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tv-container">
        <div id="tv-screen">
            <video id="tv-video" controls></video>
        </div>
        <div id="tv-controls">
            <button id="previous-channel">Previous</button>
            <span id="channel-name">No channel</span>
            <button id="next-channel">Next</button>
            <button id="close-tv">Close</button>
        </div>
        <div id="channel-list">
            <h3>Channels</h3>
            <ul id="channel-items"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
