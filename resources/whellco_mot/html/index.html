<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle MOT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mot" id="mot">
        <div class="window">
            <header>
                <h1>Vehicle MOT</h1>
                <p>Book inspections and view certificates.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="certificates" id="certificates"></div>

            <div class="failures" id="failures"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
