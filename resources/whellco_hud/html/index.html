<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WhellCo HUD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="hud" class="hidden">
        <div class="hud-group">
            <div class="bar health">
                <div class="fill"></div>
                <span class="icon">❤</span>
            </div>

            <div class="bar armor">
                <div class="fill"></div>
                <span class="icon">🛡</span>
            </div>

            <div class="bar stamina">
                <div class="fill"></div>
                <span class="icon">⚡</span>
            </div>

            <div class="bar hunger">
                <div class="fill"></div>
                <span class="icon">🍔</span>
            </div>

            <div class="bar thirst">
                <div class="fill"></div>
                <span class="icon">💧</span>
            </div>

            <div class="bar stress">
                <div class="fill"></div>
                <span class="icon">🧠</span>
            </div>

            <div class="bar oxygen">
                <div class="fill"></div>
                <span class="icon">🫁</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
