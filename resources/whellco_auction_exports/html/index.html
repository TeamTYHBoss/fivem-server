<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Exports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auction-exports" id="auction-exports">
        <div class="window">
            <header>
                <h1>Vehicle Auction Exports</h1>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
