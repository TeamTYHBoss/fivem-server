<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Banking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="banking" id="banking">
        <div class="window">
            <header>
                <h1>Banking</h1>
                <p>Manage your account, deposits and transfers.</p>
            </header>

            <div class="balance" id="balance"></div>

            <div class="actions">
                <input id="amount" type="number" placeholder="Amount">
                <button id="deposit-button">Deposit</button>
                <button id="withdraw-button">Withdraw</button>
                <button id="transfer-button">Transfer</button>
            </div>

            <div class="transactions" id="transactions"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
