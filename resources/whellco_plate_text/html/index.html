<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Plate Text</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="plate-text" id="plate-text">
        <div class="window">
            <header>
                <h1>Vehicle Plate Text</h1>
                <p>Set custom plate text.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="plate-options">
                <input id="plate-input" maxlength="8" placeholder="Enter plate text">
                <button id="apply-button">Apply Plate Text</button>
            </div>

            <div class="plate-list" id="plate-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
