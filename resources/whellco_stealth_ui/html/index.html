<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stealth UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="stealth-header">Stealth</div>

    <script src="script.js"></script>

</html>
