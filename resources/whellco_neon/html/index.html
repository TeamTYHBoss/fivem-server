<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="neon" id="neon">
        <div class="window">
            <header>
                <h1>Vehicle Neon</h1>
                <p>Choose neon colors and styles.</p>
            </header>

            <div class="vehicles" id="vehicles"></div>

            <div class="neon-options">
                <select id="color-select"></select>
                <select id="style-select"></select>
                <button id="apply-button">Apply Neon</button>
            </div>

            <div class="neon-list" id="neon-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
