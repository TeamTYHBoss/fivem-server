<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WhellCo Interior Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        #loading {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.8;
        }

        .interior {
            font-size: 24px;
            font-weight: 600;
        }

        .bar {
            width: 320px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: #0096ff;
            animation: load 2.5s ease-in-out forwards;
        }

        @keyframes load {
            from { width: 0%; }
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="title" id="title">Loading Interior</div>
        <div class="interior" id="interior"></div>
        <div class="subtitle" id="subtitle">Preparing the environment...</div>
        <div class="bar">
            <div class="bar-fill" id="bar"></div>
        </div>
    </div>

    <script>
        window.addEventListener('message', function(event) {
            const data = event.data || {};

            if (data.action === 'showLoadingScreen') {
                document.getElementById('title').innerText = data.title || 'Loading Interior';
                document.getElementById('subtitle').innerText = data.subtitle || 'Preparing the environment...';
                document.getElementById('interior').innerText = data.interior || '';
                document.body.style.backgroundColor = `rgb(${data.backgroundColor ? data.backgroundColor.join(',') : '10,10,15'})`;
                document.getElementById('bar').style.background = `rgb(${data.accentColor ? data.accentColor.join(',') : '0,150,255'})`;
                document.body.style.display = 'flex';
            }

            if (data.action === 'hideLoadingScreen') {
                document.body.style.display = 'none';
            }
        });

        fetch(`https://${GetParentResourceName()}/closeLoadingScreen`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
    </script>
</body>
</html>
