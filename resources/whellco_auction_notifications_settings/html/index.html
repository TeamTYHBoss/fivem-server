<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Notification Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="notification-settings" id="notification-settings">
        <div class="window">
            <header>
                <h1>Auction Alert Settings</h1>
                <p>Choose how you receive auction notifications.</p>
            </header>

            <div class="settings-options">
                <select id="channel-select"></select>
            </div>

            <div class="preference-list" id="preference-list"></div>

            <button id="save-button">Save Settings</button>
            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
