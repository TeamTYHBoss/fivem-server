<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Auction Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auction-archive" id="auction-archive">
        <div class="window">
            <header>
                <h1>Vehicle Auction Archive</h1>
                <p>View archived auctions.</p>
            </header>

            <div class="archive-options">
                <select id="filter-select"></select>
                <button id="filter-button">Apply Filter</button>
            </div>

            <div class="archive-list" id="archive-list"></div>

            <button id="close-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
