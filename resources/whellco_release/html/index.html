<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Release Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="release" id="release">
        <div class="window">

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
