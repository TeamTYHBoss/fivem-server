## FiveM server configuration

# Server identity
sv_hostname "My FiveM Server"

# Maximum players
sv_maxclients 32

# Server license key: replace this before starting the server.
# Obtain one from https://keymaster.fivem.net/
sv_licenseKey "CHANGE_ME"

# Steam Web API key, optional but recommended for some resources.
# sv_steamAPIKey "CHANGE_ME"

# MySQL connection string, required only when using database resources.
# set mysql_connection_string "mysql://username:password@localhost/database?charset=utf8mb4"

# Load core FiveM resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure fivem
ensure hardcap
ensure rconlog
ensure essentialmode

# Load database support before economy-dependent resources
ensure oxmysql

# Load live server information before the loading screen
ensure whellco_server_info

# Load the custom loading screen before gameplay resources
ensure whellco_loadscreen

# Load the character system before gameplay resources
ensure whellco_characters

# Load the custom spawn selector
ensure whellco_spawn_selector

# Load the character wardrobe
ensure whellco_wardrobe

# Load the housing system
ensure whellco_housing

# Load the persistent economy, XP, levels, shops and receipts
ensure whellco_economy

# Load immersive jobs, shops, transport and services
ensure whellco_immersion

# Load the vehicle ownership system
ensure whellco_vehicles

# Load the phone system
ensure whellco_phone

# Load the job center
ensure whellco_jobcenter

# Load the admin panel
ensure whellco_admin

# Load this project's starter resource
ensure my_first_resource

# Resource and script settings
sv_scriptHookAllowed 0

# Disable unnecessary telemetry where supported
sv_enforceGameBuild 3095

# Network settings
sv_endpoint "0.0.0.0:30120"

# Admin permissions
# Replace REPLACE_WITH_YOUR_LICENSE with your own FiveM license identifier.
# add_ace group.admin command.admin allow
# add_principal identifier.license:REPLACE_WITH_YOUR_LICENSE group.admin
