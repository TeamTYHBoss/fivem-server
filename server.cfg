## FiveM server configuration

# Server identity
sv_hostname "My FiveM Server"

# Maximum players
sv_maxclients 32

# Server license key: replace this before starting the server.
# Obtain one from https://keymaster.fivem.net/
sv_licenseKey "CHANGE_ME"

# Steam Web API key, optional but recommended for some resources.
# sv_steamAPIKey "CHANGE_ME"

# MySQL connection string, required only when using database resources.
# set mysql_connection_string "mysql://username:password@localhost/database?charset=utf8mb4"

# Load core FiveM resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure fivem
ensure hardcap
ensure rconlog
ensure essentialmode

# Load database support before economy-dependent resources
ensure oxmysql

# Load live server information before the loading screen
ensure whellco_server_info

# Load the custom loading screen before gameplay resources
ensure whellco_loadscreen

# Load the character system before gameplay resources
