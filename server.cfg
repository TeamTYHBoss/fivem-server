# Resource and script settings
sv_scriptHookAllowed 0

# Disable unnecessary telemetry where supported
sv_enforceGameBuild 3095

# Network settings
sv_endpoint "0.0.0.0:30120"

# Admin permissions
# Replace REPLACE_WITH_YOUR_LICENSE with your own FiveM license identifier.
add_ace group.admin whellco.admin allow
add_principal identifier.license:REPLACE_WITH_YOUR_LICENSE group.admin
